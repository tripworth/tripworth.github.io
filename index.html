<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TripWorth — сколько стоит поездка</title>
<meta name="description" content="Билеты, жильё, достопримечательности и нишевые места — и бюджет поездки на всю компанию.">
<meta name="theme-color" content="#FFF6EF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23F75A0A'/%3E%3Cpath d='M22 24c0-6 5-10 11-10s11 4 11 10c0 5-3 8-8 9-4 1-6 3-6 7v2' fill='none' stroke='%23FFF4EC' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='30' cy='50' r='4' fill='none' stroke='%23FFF4EC' stroke-width='3.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://upload.wikimedia.org"><link rel="preconnect" href="https://commons.wikimedia.org" crossorigin><link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin><link rel="dns-prefetch" href="https://ru.wikipedia.org"><link rel="dns-prefetch" href="https://en.wikipedia.org">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="maplibre-gl.css" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.1/dist/maplibre-gl.css'">
<style>:root {
  --or: #f75a0a; --or2: #d94c05; --or-soft: #ffe3d2; --plum: #3a0e2e; --plum2: #5b2350;
  --lil: #d9c3ee; --lil2: #efe4f8; --cream: #fff6ef; --paper: #fffaf6; --muted: #7a6672; --line: rgba(58,14,46,.12);
  --c1: #f75a0a; --c2: #ffab7a; --c3: #b68ad8; --c4: #d9c3ee; --c5: #6a2b5c;
  --r: 22px; --sh: 0 1px 2px rgba(58,14,46,.05), 0 14px 34px -16px rgba(58,14,46,.25);
  --f: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--cream); color: var(--plum); font-family: var(--f); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--or); outline-offset: 2px; }
.wrap { max-width: 1160px; margin: 0 auto; padding: 0 18px; }
.muted { color: var(--muted); margin: 0; }
.small { font-size: 13px; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--sh); padding: 22px; }

.hdr { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--cream) 90%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.hdr__in { display: flex; align-items: center; justify-content: space-between; height: 62px; gap: 12px; }
.logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
.logo__mark { width: 36px; height: 36px; }
.logo__name { font-weight: 800; font-size: 22px; letter-spacing: -.03em; }
.hdr__tag { font-weight: 600; color: var(--muted); font-size: 14px; }
@media (max-width: 560px) { .hdr__tag { display: none; } }

.hero { padding: 36px 0 24px; background: radial-gradient(120% 80% at 90% 0%, var(--lil2), transparent 60%); }
.hero__t { margin: 0; font-weight: 800; font-size: clamp(38px, 7vw, 64px); letter-spacing: -.04em; line-height: 1.02; }
.hero__s { margin: 12px 0 22px; max-width: 620px; font-size: 18px; color: var(--plum2); }

.search { display: flex; flex-direction: column; gap: 14px; }
.search__row { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 760px) { .search__row { grid-template-columns: 1fr 1fr; } .search__row--3 { grid-template-columns: 1fr 1fr 1fr; } .search__row--one { grid-template-columns: 1fr; } }
.fld { display: flex; flex-direction: column; gap: 6px; position: relative; min-width: 0; }
.fld label, .fld > span { font-size: 13px; font-weight: 700; color: var(--plum2); }
.inp { width: 100%; min-height: 50px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: #fff; font-weight: 600; }
.inp:focus { outline: none; border-color: var(--or); box-shadow: 0 0 0 3px var(--or-soft); }
.sug { position: absolute; top: 100%; left: 0; right: 0; z-index: 40; margin-top: 4px; background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--sh); overflow: hidden; }
.sug__i { display: flex; flex-direction: column; align-items: flex-start; width: 100%; padding: 10px 14px; border: 0; background: none; text-align: left; cursor: pointer; }
.sug__i:hover { background: var(--lil2); }
.sug__i small { color: var(--muted); }
.step { display: flex; align-items: center; justify-content: space-between; min-height: 50px; border: 1px solid var(--line); border-radius: 14px; background: #fff; padding: 4px; }
.step output { font-weight: 800; font-size: 20px; }
.step__b { width: 42px; height: 42px; border-radius: 10px; border: 0; background: var(--lil2); font-size: 22px; font-weight: 700; cursor: pointer; }
.err { margin: 0; color: #b42318; font-weight: 700; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 20px; border-radius: 999px; border: 0; font-weight: 800; text-decoration: none; cursor: pointer; }
.btn--main { background: var(--or); color: #fff; min-height: 58px; font-size: 18px; }
.btn--main:hover { background: var(--or2); }
.btn--line { border: 1.5px solid var(--plum); background: transparent; }
.btn--line:hover { background: var(--plum); color: #fff; }
.btn--sm { min-height: 34px; padding: 0 14px; background: var(--or); color: #fff; font-size: 14px; }

.howto { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; padding: 18px 0 60px; }
.howto div { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 16px; font-weight: 600; }
.howto b { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--or); color: #fff; margin-bottom: 8px; }

.res { display: grid; grid-template-columns: 1fr; gap: 16px; padding: 10px 18px 60px; }
.res__main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
@media (min-width: 980px) { .res { grid-template-columns: 380px 1fr; align-items: start; } .res__side { position: sticky; top: 76px; } }
.h2 { margin: 0 0 10px; font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
.h2 small { font-size: 14px; font-weight: 600; color: var(--muted); margin-left: 6px; }
.kicker { margin: 0; font-weight: 700; color: var(--muted); font-size: 14px; }
.note { margin: 0 0 8px; padding: 10px 12px; border-radius: 12px; background: var(--lil2); font-size: 14px; font-weight: 600; }

.budget__big { display: flex; flex-direction: column; margin: 6px 0 2px; }
.budget__big span { font-size: 46px; font-weight: 800; letter-spacing: -.04em; line-height: 1.05; }
.budget__big small { color: var(--muted); font-weight: 700; }
.budget__sub { margin: 4px 0 14px; font-size: 15px; }
.bar { display: flex; height: 16px; border-radius: 99px; overflow: hidden; background: var(--lil2); }
.c1 { background: var(--c1); } .c2 { background: var(--c2); } .c3 { background: var(--c3); } .c4 { background: var(--c4); } .c5 { background: var(--c5); }
.rows { list-style: none; margin: 14px 0 0; padding: 0; }
.rows li { display: grid; grid-template-columns: auto 1fr auto; grid-template-rows: auto auto; column-gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-weight: 700; }
.rows li em { grid-column: 2; font-style: normal; font-weight: 500; font-size: 13px; color: var(--muted); }
.rows li b { grid-row: 1 / 3; grid-column: 3; align-self: center; }
.dot { width: 12px; height: 12px; border-radius: 4px; margin-top: 5px; grid-row: 1 / 3; }
.tune { margin-top: 12px; }
.tune summary { cursor: pointer; font-weight: 800; color: var(--or2); }
.tune__g { display: grid; gap: 8px; margin: 10px 0; }
.tune__g label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; }
.tune__g .inp { min-height: 42px; }

.offers { list-style: none; margin: 0 0 12px; padding: 0; }
.offer { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.offer:first-child { border-top: 0; }
.offer small { display: block; color: var(--muted); font-size: 13px; }
.offer__r { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.offer__r b { font-size: 20px; }
.links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.links__t { margin: 16px 0 0; font-size: 14px; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 8px; }
.tab { border: 0; border-radius: 999px; padding: 9px 14px; background: var(--lil2); font-weight: 800; cursor: pointer; }
.tab sup { font-size: 11px; margin-left: 3px; color: var(--muted); }
.tab.is-on { background: var(--or); color: #fff; }
.tab.is-on sup { color: #ffe3d2; }
.places-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin: 10px 0; }
@media (min-width: 760px) { .places-grid { grid-template-columns: 1.1fr 1fr; } }
.map { height: 360px; border-radius: 16px; border: 1px solid var(--line); z-index: 1; }
.places-list { max-height: 420px; overflow: auto; }
.places { list-style: none; margin: 0; padding: 0; }
.places li { display: grid; grid-template-columns: 84px 1fr auto; gap: 12px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.places__ph { position: relative; width: 84px; height: 64px; border-radius: 12px; overflow: hidden; background: var(--lil2); }
.places__ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.places__ph .places__n { position: absolute; left: 5px; top: 5px; z-index: 1; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
.places__ph.is-none { height: 40px; background: transparent; }
.places__ph.is-none .places__n { position: static; margin: 7px 0 0 0; }
@media (max-width: 560px) { .places li { grid-template-columns: 64px 1fr; } .places__ph { width: 64px; height: 52px; } .places__a { grid-column: 2; } }
.pop__img { display: block; width: 100%; max-height: 130px; object-fit: cover; border-radius: 8px; margin-bottom: 6px; }
.places li:first-child { border-top: 0; }
.places small { display: block; color: var(--muted); font-size: 13px; }
.places__n { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--plum); color: #fff; font-size: 12px; font-weight: 800; }
.places__a { font-size: 13px; font-weight: 700; white-space: nowrap; }
.places__a a { color: var(--or2); }
.pin span { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--or); color: #fff; font: 800 12px var(--f); border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
.skel { height: 54px; border-radius: 14px; margin: 8px 0; background: linear-gradient(90deg, var(--lil2), #fff, var(--lil2)); background-size: 200% 100%; animation: sh 1.2s linear infinite; }
@keyframes sh { to { background-position: -200% 0; } }
.foot { border-top: 1px solid var(--line); padding: 18px 0 28px; color: var(--muted); font-size: 13px; }

.pick-btn { align-self: flex-start; border: 0; background: var(--lil2); color: var(--plum); font-weight: 800; padding: 10px 16px; border-radius: 999px; cursor: pointer; }
.pick-btn:hover { background: var(--lil); }
.picker { display: flex; flex-direction: column; gap: 6px; }
.pickmap { height: 420px; border-radius: 16px; border: 1px solid var(--line); z-index: 1; }
.fresh { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 0 0 6px; font-size: 14px; font-weight: 700; }
.link-btn { border: 0; background: none; color: var(--or2); font-weight: 800; cursor: pointer; padding: 0; text-decoration: underline; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chips b { font-size: 13px; margin-right: 4px; }
.chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 14px; cursor: pointer; }
.chip:hover { border-color: var(--or); color: var(--or2); }
.chip--ab { background: var(--lil2); }
.bag__t { margin: 0; }
.bag__on { display: flex; align-items: center; gap: 8px; font-weight: 800; cursor: pointer; }
.bag__on input { width: 20px; height: 20px; accent-color: var(--or); }
.bag__in { display: flex; flex-direction: column; gap: 4px; font-weight: 700; font-size: 13px; }
.bag__in .inp { min-height: 42px; max-width: 260px; }
.chips { max-height: 132px; overflow: auto; }

/* Карта выбора: страны → города */
.wmap { position: relative; overflow: hidden; background: #dcebf5; touch-action: none; user-select: none; cursor: grab; }
.wmap.is-drag { cursor: grabbing; }
.wmap__svg { position: absolute; left: -100%; top: -100%; width: 300%; height: 300%; display: block; transform-origin: 33.3333% 33.3333%; will-change: transform; }
.wmap__c { fill: #efe7df; stroke: #fff; stroke-width: .35; vector-effect: non-scaling-stroke; transition: fill .15s; }
.wmap__c.is-trip { fill: #ffd2b8; cursor: pointer; }
.wmap__c.is-trip.is-hover { fill: var(--or); }
.is-country .wmap__c { fill: #ece6e0; }
.is-country .wmap__c.is-trip { fill: #f6dccd; }
.is-country .wmap__c.is-focus, .is-country .wmap__c.is-trip.is-focus { fill: #fff3ea; stroke: var(--or); stroke-width: 1.2; cursor: crosshair; }
.wmap__pin { cursor: pointer; }
.wmap__pin circle { fill: var(--or); stroke: #fff; stroke-width: .35; }
.wmap__pin text { font: 700 2.4px var(--f); fill: var(--plum); paint-order: stroke; stroke: #fffaf6; stroke-width: .5px; stroke-linejoin: round; }
.wmap__pin:hover circle { fill: var(--plum); r: 1.3; }
.wmap__pin.no-label text { display: none; }
.wmap__pin.no-label:hover text { display: inline; }
.wmap__tip { position: absolute; pointer-events: none; background: var(--plum); color: #fff; font: 700 13px var(--f); padding: 5px 9px; border-radius: 8px; white-space: nowrap; z-index: 3; }
.wmap__back { position: absolute; top: 10px; left: 10px; z-index: 2; border: 0; background: #fff; color: var(--plum); font: 800 14px var(--f); padding: 8px 12px; border-radius: 10px; box-shadow: 0 2px 8px rgba(58,14,46,.18); cursor: pointer; }
.wmap__zoom { position: absolute; right: 10px; top: 10px; z-index: 2; display: flex; flex-direction: column; gap: 4px; }
.wmap__zoom button { width: 34px; height: 34px; border: 0; border-radius: 10px; background: #fff; font: 800 18px var(--f); color: var(--plum); box-shadow: 0 2px 8px rgba(58,14,46,.18); cursor: pointer; }
.wmap__back:hover, .wmap__zoom button:hover { color: var(--or2); }
.wmap__load { position: absolute; inset: 0; display: grid; place-items: center; color: var(--plum); font-weight: 700; }
.chip i { font-style: normal; font-weight: 600; opacity: .55; margin-left: 2px; }
.chip--back { background: var(--plum); color: #fff; border-color: var(--plum); }
.chip--back:hover { color: #fff; opacity: .9; }
@media (max-width: 640px) { .pickmap { height: 340px; } }
.wmap__cdot { cursor: pointer; }
.wmap__cdot circle { fill: #ffd2b8; stroke: var(--or); stroke-width: .3; }
.wmap__cdot:hover circle { fill: var(--or); }
.wmap__c.is-trip.is-direct { fill: #ffab7d; }
.is-country .wmap__c.is-trip.is-direct { fill: #f6dccd; }
.wmap__pin.is-via circle { fill: #fff; stroke: var(--plum2); stroke-width: .45; }
.wmap__pin.is-via text { fill: #7a5b6f; font-weight: 600; }
.wmap__pin.is-direct circle { r: 1.25; }
.wmap__load.is-error { inset: auto 10px 10px 10px; display: block; background: #fff; border-radius: 10px; padding: 10px 12px; box-shadow: 0 2px 8px rgba(58,14,46,.15); font-size: 14px; }
.chip--direct { background: #fff1e8; border-color: #ffb48a; }
.chip--via { background: #fff; color: #7a5b6f; font-weight: 600; }
.lg { display: inline-flex; align-items: center; gap: 5px; margin-left: 12px; white-space: nowrap; }
.lg i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.lg__d { background: var(--or); }
.lg__v { background: #fff; border: 1.5px solid var(--plum2); }
.note--demo { background: #fff4d6; border-color: #f2c94c; }
.nobag { color: var(--or2); font-weight: 700; }
.wmap__c.has-air { fill: #f3e9e1; cursor: pointer; }
.wmap__c.has-air.is-hover { fill: #f8c9ab; }
.wmap__pin.is-minor text { font-weight: 600; font-size: 2.1px; }
.wmap__pin.is-minor circle { fill: #c9a99a; }
.wmap__pin.is-minor.is-direct circle { fill: var(--or); }
.chips__more { font-size: 13px; color: #7a5b6f; padding: 6px 4px; }
.wmap__cdot text { font: 700 2px var(--f); fill: var(--plum); paint-order: stroke; stroke: #fffaf6; stroke-width: .45px; stroke-linejoin: round; pointer-events: none; }
.wmap__cdot.no-label text { display: none; }
.wmap__cdot.no-label:hover text { display: inline; }
.lg__c { background: #ffd2b8; border: 1.5px solid var(--or); }
.wmap__names text { font-family: var(--f); font-weight: 800; fill: var(--plum); text-anchor: middle; dominant-baseline: middle; paint-order: stroke; stroke: rgba(255,250,246,.85); stroke-linejoin: round; cursor: pointer; }
.wmap__mark { pointer-events: none; }
.wmap__mark path { fill: #e5322d; stroke: #fff; stroke-width: .35; filter: drop-shadow(0 .3px .4px rgba(0,0,0,.35)); }
.wmap__mark circle { fill: #fff; }
.wmap__mark text { font: 800 2.2px var(--f); fill: #b3141b; text-anchor: middle; paint-order: stroke; stroke: #fff; stroke-width: .55px; stroke-linejoin: round; }
.wmap__pin.under-mark text { display: none; }
.sug__air { color: var(--or2); font-weight: 700; }

/* Календарь */
.datebtn { text-align: left; cursor: pointer; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.datebtn.is-on { border-color: var(--or); box-shadow: 0 0 0 3px rgba(247,90,10,.15); }
.cal { margin: 4px 0 12px; padding: 14px; border: 1px solid var(--line); border-radius: 18px; background: #fff; box-shadow: 0 10px 30px rgba(58,14,46,.10); }
.cal__head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.cal__step { font-weight: 700; font-size: 14px; text-align: center; }
.cal__nav { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: #fff; font: 800 20px var(--f); color: var(--plum); cursor: pointer; }
.cal__nav:disabled { opacity: .3; cursor: default; }
.cal__ms { display: grid; grid-template-columns: 1fr; gap: 22px; }
.cal__ms .cal__m:nth-child(2) { display: none; }
@media (min-width: 700px) { .cal__ms { grid-template-columns: 1fr 1fr; } .cal__ms .cal__m:nth-child(2) { display: block; } }
.cal__t { display: block; text-align: center; margin: 4px 0 8px; font-size: 15px; }
.cal__g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px 0; }
.cal__g i { font-style: normal; font-size: 12px; text-align: center; color: #8a7385; padding-bottom: 4px; }
.cal__g i.is-we { color: var(--or2); }
.cal__d { height: 40px; border: 0; background: none; font: 700 15px var(--f); color: var(--plum); cursor: pointer; display: grid; place-items: center; border-radius: 0; }
button.cal__d:hover { background: #fff1e8; border-radius: 12px; }
.cal__d.is-we { color: var(--or2); }
.cal__d.is-off { color: #cdbfc8; cursor: default; }
.cal__d.is-today { text-decoration: underline; text-underline-offset: 4px; }
.cal__d.in-range { background: #ffe6d6; border-radius: 0; }
.cal__d.is-start, .cal__d.is-end, button.cal__d.is-start:hover, button.cal__d.is-end:hover { background: var(--or); color: #fff; border-radius: 12px; }
.cal__d.is-start + .in-range, .cal__d.in-range + .is-end { box-shadow: none; }
.cal__foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.cal__sum { font-size: 14px; }
.cal__quick { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

/* Жильё */
.stay-main { display: block; margin: 10px 0 12px; padding: 14px 16px; border-radius: 16px; background: linear-gradient(135deg, #fff1e8, #f6ecfb); border: 1px solid #ffc9a8; color: var(--plum); text-decoration: none; }
.stay-main b { display: block; font-size: 17px; }
.stay-main small { display: block; margin-top: 4px; font-size: 13px; color: #6d5266; }
.stay-main:hover { border-color: var(--or); }
.conv { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }
.conv__t { margin: 0 0 8px; font-size: 14px; }
.conv__row { display: grid; grid-template-columns: 1fr; gap: 8px; align-items: center; }
@media (min-width: 640px) { .conv__row { grid-template-columns: 140px minmax(0, 1fr) auto auto; } }
.conv__res { font-size: 15px; white-space: nowrap; }

/* Варианты жилья */
.stays-wrap { margin: 12px 0 14px; }
.stays-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
.stays-ctl { display: flex; flex-wrap: wrap; gap: 6px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: #fff; }
.seg__b { border: 0; background: none; padding: 6px 12px; font: 700 13px var(--f); color: var(--plum); cursor: pointer; }
.seg__b.is-on { background: var(--plum); color: #fff; }
.stays { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 640px) { .stays { grid-template-columns: 1fr 1fr; } }
.stay { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: #fff; min-height: 128px; }
.stay.skel { min-height: 128px; }
.stay__img { position: relative; background: linear-gradient(135deg, #ffe2cf, #eadcf3) center/cover; display: grid; place-items: center; font-size: 32px; }
.stay__img::before { content: attr(data-ico); }
.stay__img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.stay__rt { position: absolute; left: 6px; top: 6px; background: #2f9e5a; color: #fff; font: 800 12px var(--f); padding: 2px 6px; border-radius: 8px; }
.stay__b { padding: 9px 10px 9px 0; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stay__n { font-size: 15px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.stay__m, .stay__o { font-size: 12px; color: #7a5b6f; }
.stay__o { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stay__p { margin-top: auto; }
.stay__p b { font-size: 17px; }
.stay__p small { display: block; font-size: 12px; color: #7a5b6f; }
.stay__a { display: flex; gap: 10px; align-items: center; margin-top: 4px; }

/* Места: фильтры известности и цен */
.pfilters { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 12px; }
.seg--wrap { flex-wrap: wrap; border-radius: 14px; }
.seg__b i { font-style: normal; opacity: .6; font-weight: 600; }
.badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.badges em { font-style: normal; font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 999px; }
.fame--3 { background: #3a0e2e; color: #fff; }
.fame--2 { background: #ead9f2; color: #3a0e2e; }
.fame--1 { background: #fff1e8; color: #b8460c; }
.fame--0 { background: #e4f4ea; color: #1f7a45; }
.price { background: #f3eee9; color: #6d5266; }
.places__d { display: block; color: #7a5b6f; font-size: 12px; margin-top: 2px; }
.stays-soon { margin: 10px 0 12px; padding: 12px 14px; border-radius: 14px; background: #f6f0fa; font-size: 14px; color: #5a3f53; }
.maplibregl-popup-content { font: 500 13px var(--f); border-radius: 10px; padding: 8px 10px; }
.map .maplibregl-ctrl-attrib { font-size: 11px; }
.pin { cursor: pointer; }

.s22-btn { display: flex; flex-direction: column; gap: 3px; width: 100%; text-align: left; margin-top: 14px; padding: 14px 16px; border-radius: 14px; border: 2px solid var(--or); background: #fff4ec; color: var(--plum); cursor: pointer; font: inherit; }
.s22-btn b { font-size: 16px; } .s22-btn small { color: var(--muted); font-size: 13px; }
.s22-btn:hover { background: #ffe8d8; }
.s22 { position: fixed; inset: 0; z-index: 1000; background: rgba(30, 10, 40, .55); display: grid; place-items: center; padding: 16px; }
.s22[hidden] { display: none; }
.s22__in { width: min(1200px, 100%); height: min(860px, 100%); background: #fff; border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.s22__bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.s22__x { border: 0; background: var(--lil2); color: var(--plum); width: 36px; height: 36px; border-radius: 50%; font-size: 16px; cursor: pointer; flex: none; }
.s22 iframe { flex: 1; width: 100%; border: 0; }
.s22__note { margin: 0; padding: 6px 14px 8px; font-size: 12px; color: var(--muted); }
@media (max-width: 560px) { .s22 { padding: 0; } .s22__in { border-radius: 0; height: 100%; } }
body.no-scroll { overflow: hidden; }

/* билеты */
.btn--wide { display: flex; width: 100%; margin-top: 14px; background: var(--or); color: #fff; min-height: 50px; text-align: center; white-space: normal; line-height: 1.25; padding: 10px 18px; }
.btn--wide:hover { filter: brightness(1.05); }
.btn--sm.btn--line { background: transparent; color: var(--plum); border: 1.5px solid var(--plum); }
.btn--on { background: var(--plum) !important; color: #fff !important; }
.fl-bag { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: 4px 0 10px; }
.fl-bag__in { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--muted); }
.fl-bag__in .inp { width: 110px; min-height: 36px; padding: 0 10px; }
.offer { align-items: center; padding: 12px; margin: 6px 0; border: 1.5px solid var(--line); border-radius: 14px; }
.offer:first-child { border-top: 1.5px solid var(--line); }
.offer.is-on { border-color: var(--or); background: #fff7f1; }
.offer__l { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.offer__a { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; margin-top: 4px; }
.offer__a .btn { white-space: nowrap; }
@media (max-width: 560px) { .offer { flex-direction: column; align-items: stretch; } .offer__r { align-items: flex-start; text-align: left; } .offer__a { justify-content: flex-start; } }
.fl-est { padding: 12px 14px; border-radius: 14px; background: var(--lil2); }
.fl-est__p { margin: 0 0 4px; font-size: 15px; }
.fl-est__p b { font-size: 22px; }

.s22-in { margin: 14px 0 4px; }
.s22-slot { height: min(80vh, 820px); border-radius: 14px; overflow: hidden; border: 1.5px solid var(--line); background: var(--lil2); margin-top: 8px; }
.s22-slot iframe { width: 100%; height: 100%; border: 0; display: block; }
@media (max-width: 560px) { .s22-slot { height: 82vh; margin-left: -6px; margin-right: -6px; } }

.places__more { display: flex; width: 100%; margin-top: 10px; }
.places__ph { background: linear-gradient(135deg, #ffe2cf, #eadcf3); }
.s22-in .small a { display: inline-block; font-weight: 700; }

.s22-wide { margin-top: 18px; }
.s22-wide .s22-in { margin: 0; }
.res-wide { margin-top: 18px; }
.s22-jump { display: block; margin-top: 14px; padding: 14px 16px; border-radius: 14px; border: 2px solid var(--or); background: #fff4ec; color: var(--plum); font-weight: 800; text-decoration: none; }
.s22-jump:hover { background: #ffe8d8; }
.res-wide { padding-bottom: 60px; }
.res { padding-bottom: 0; }

/* Budget: one shared trip, two ways to read the same calculation. */
.budget-view { display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:4px; margin:14px 0; background:var(--lil2); border-radius:14px; }
.budget-view button { border:0; border-radius:10px; padding:10px 6px; font:inherit; font-size:14px; font-weight:750; background:transparent; cursor:pointer; color:var(--muted); }
.budget-view button[aria-pressed="true"] { background:var(--paper); color:var(--plum); box-shadow:0 2px 8px #28133712; }
.budget-view button:focus-visible { outline:2px solid var(--or); outline-offset:2px; }
.budget__heading { margin:18px 0 4px; font-size:15px; font-weight:800; }
.budget__caption { margin:0; font-size:12px; color:var(--muted); }
.budget .rows { margin-top:8px; }
.budget .rows li { grid-template-columns:12px minmax(0,1fr); }
.budget .rows li b { grid-column:2; grid-row:auto; font-size:17px; margin-top:4px; }
.budget .rows li em { line-height:1.5; }
.budget-daily { padding:14px; margin-top:14px; background:var(--lil2); border-radius:16px; }
.budget-daily .budget__heading { margin:0 0 5px; }
.budget-daily strong { font-size:26px; letter-spacing:-.03em; }
.budget-daily p:not(.budget__heading), .budget-daily small { font-size:12px; line-height:1.6; color:var(--muted); }
.budget-daily p { margin:6px 0; }
.budget-method { margin-top:14px; font-size:13px; }
.budget-method summary { cursor:pointer; font-weight:750; }
.budget-method p { line-height:1.6; color:var(--muted); }
@media (min-width:980px) { .res__side { position:static; } }
@media (max-width:400px) { .budget__big span { font-size:38px; } }

.photo-empty { display:none; }
.places__ph.is-none .photo-empty { display:block; padding:24px 4px 4px; font-size:10px; line-height:1.2; text-align:center; color:var(--muted); }

.places__ph.is-none { height:64px; background:var(--lil2); }
.places__ph.is-none .places__n { position:absolute; left:5px; top:5px; margin:0; }

.baggage-method { font-size:12px; width:100%; } .baggage-method summary { cursor:pointer; font-weight:700; } .baggage-method p { line-height:1.6; color:var(--muted); } .flight-route { margin-top:5px; } .offer .flight-base { color:var(--plum); font-weight:700; margin-top:6px; }
